apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: soat-execucao-api-hpa
  namespace: soat-execucao

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: soat-execucao-api

  minReplicas: 1
  maxReplicas: 3

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
