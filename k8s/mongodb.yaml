# MongoDB auto-hospedado (StatefulSet + PVC), não um serviço gerenciado — evita custo
# adicional na conta AWS Academy (sem DocumentDB/Atlas). 1 réplica só: é o banco NoSQL
# de 1 único microsserviço, sem requisito de alta disponibilidade neste projeto
# acadêmico.

apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mongodb
  namespace: soat-execucao

spec:
  serviceName: mongodb
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "300m"

  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service

metadata:
  name: mongodb
  namespace: soat-execucao

spec:
  clusterIP: None # headless — nome DNS estável para o StatefulSet (mongodb-0.mongodb...)
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
