# MongoDB auto-hospedado (StatefulSet), não um serviço gerenciado — evita custo
# adicional na conta AWS Academy (sem DocumentDB/Atlas). 1 réplica só: é o banco NoSQL
# de 1 único microsserviço, sem requisito de alta disponibilidade neste projeto
# acadêmico.
#
# Disco efêmero (emptyDir), não PVC: o cluster está no k8s 1.31, que removeu o
# provisionamento in-tree de EBS (precisaria do addon EBS CSI Driver, não
# instalado) — um PVC aqui ficaria Pending pra sempre e o pod nunca subiria.
# Dados se perdem se o pod reiniciar; aceitável para este projeto acadêmico.

apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mongodb
  namespace: soat-execucao

spec:
  serviceName: mongodb
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      # Este pod nunca chama a API do Kubernetes — desabilita o automount do token do
      # service account (reduz a superfície de ataque caso o pod seja comprometido).
      automountServiceAccountToken: false

      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

          # ephemeral-storage agora cobre também os dados do Mongo (emptyDir,
          # não PVC — ver comentário no topo do arquivo), por isso o limite é
          # bem maior que antes.
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
              ephemeral-storage: "1200Mi"
            limits:
              memory: "384Mi"
              cpu: "300m"
              ephemeral-storage: "1536Mi"

      volumes:
        - name: mongodb-data
          emptyDir: {}

---
apiVersion: v1
kind: Service

metadata:
  name: mongodb
  namespace: soat-execucao

spec:
  clusterIP: None # headless — nome DNS estável para o StatefulSet (mongodb-0.mongodb...)
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
