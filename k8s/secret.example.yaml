# Template — NÃO aplicado diretamente. O CI/CD gera o Secret real em tempo de deploy
# a partir do SSM Parameter Store (Mongo/JWT/RabbitMQ via infra-k8s). Para rodar
# localmente, use o docker compose (ver README) em vez de aplicar este arquivo.

apiVersion: v1
kind: Secret

metadata:
  name: soat-execucao-api-secret
  namespace: soat-execucao

type: Opaque

stringData:
  MongoSettings__ConnectionString: "mongodb://mongodb.soat-execucao.svc.cluster.local:27017"
  JwtSettings__Secret: "SuaChaveSuperSecretaComMinimo32Caracteres"
  RabbitMq__Host: "rabbitmq.rabbitmq.svc.cluster.local"
  RabbitMq__VirtualHost: "/"
  RabbitMq__Username: "guest"
  RabbitMq__Password: "guest"
  NEW_RELIC_LICENSE_KEY: "sua-license-key-newrelic"
